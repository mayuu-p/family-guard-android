name: Build Family Guard APK (Android 10–16)

on:
  workflow_dispatch:
  push:
    paths:
      - 'family_guard_android_source.zip'
      - '.github/workflows/android-apk.yml'
      - 'fixes/main.dart'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Extract source
        run: |
          unzip -q family_guard_android_source.zip -d unpacked
          cp fixes/main.dart unpacked/family_guard_android/mobile/lib/main.dart

      - name: Generate Android project
        working-directory: unpacked/family_guard_android/mobile
        run: flutter create --platforms=android .

      - name: Add Android runtime location permissions
        working-directory: unpacked/family_guard_android/mobile
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("android/app/src/main/AndroidManifest.xml")
          s = p.read_text()
          permissions = [
              '    <uses-permission android:name="android.permission.INTERNET"/>',
              '    <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION"/>',
              '    <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION"/>',
          ]
          missing = [x for x in permissions if x.split('android:name="')[1].split('"')[0] not in s]
          if missing:
              s = s.replace('<application', '\\n'.join(missing) + '\\n    <application', 1)
          p.write_text(s)
          print("Manifest now declares internet + foreground coarse/fine location permissions.")
          PY

      - name: Configure Android 10–16 SDK compatibility
        working-directory: unpacked/family_guard_android/mobile
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("android/app/build.gradle.kts")
          if p.exists():
              s = p.read_text()
              s = s.replace("compileSdk = flutter.compileSdkVersion", "compileSdk = 36")
              s = s.replace("minSdk = flutter.minSdkVersion", "minSdk = 29")
              s = s.replace("targetSdk = flutter.targetSdkVersion", "targetSdk = 36")
              p.write_text(s)
          else:
              p = Path("android/app/build.gradle")
              s = p.read_text()
              s = s.replace("compileSdkVersion flutter.compileSdkVersion", "compileSdkVersion 36")
              s = s.replace("minSdkVersion flutter.minSdkVersion", "minSdkVersion 29")
              s = s.replace("targetSdkVersion flutter.targetSdkVersion", "targetSdkVersion 36")
              p.write_text(s)
          print("Configured minSdk 29, compileSdk/targetSdk 36.")
          PY

      - name: Get dependencies
        working-directory: unpacked/family_guard_android/mobile
        run: flutter pub get

      - name: Build APK
        working-directory: unpacked/family_guard_android/mobile
        run: flutter build apk --debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: family-guard-android-10-to-16
          path: unpacked/family_guard_android/mobile/build/app/outputs/flutter-apk/app-debug.apk
